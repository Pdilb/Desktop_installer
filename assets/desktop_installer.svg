  <rect x="56" y="72" width="144" height="96" rx="12" fill="#ffffff"/>
  <!-- 桌面内容 -->
  <rect x="72" y="92" width="48" height="48" rx="8" fill="#FF0000"/>
  <rect x="132" y="92" width="48" height="12" rx="6" fill="#77216F"/>
  <rect x="132" y="116" width="48" height="12" rx="6" fill="#77216F"/>
  <!-- 底座 -->
  <rect x="100" y="176" width="56" height="12" rx="6" fill="#ffffff"/>
  <rect x="84" y="192" width="88" height="12" rx="6" fill="#ffffff"/>
</svg>
