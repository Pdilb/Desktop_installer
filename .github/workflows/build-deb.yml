name: Build DEB

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deb:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        timeout-minutes: 8
        run: |
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30
          sudo apt-get install -y build-essential debhelper devscripts dh-python python3-all python3-setuptools pybuild-plugin-pyproject qt6-l10n-tools qttools5-dev-tools python3-pyside6.qtsvg fakeroot lintian

      - name: Debug lrelease
        run: |
          which lrelease || true
          which lrelease6 || true
          ls -la /usr/lib/qt6/bin/ 2>/dev/null || true

      - name: Fix permissions
        run: chmod +x debian/rules debian/desktop-installer.postinst debian/desktop-installer.postrm

      - name: Build package
        run: |
          dpkg-buildpackage -us -uc -b
          mkdir -p /tmp/deb-out
          mv ../*.deb /tmp/deb-out/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: /tmp/deb-out/*.deb

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/deb-out/*.deb
          generate_release_notes: true
