name: Build DEB

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deb:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential debhelper devscripts dh-python python3-all python3-setuptools pybuild-plugin-pyproject fakeroot lintian

      - name: Fix permissions
        run: chmod +x debian/rules

      - name: Build package
        run: |
          dpkg-buildpackage -us -uc -b
          mkdir -p /tmp/deb-out
          mv ../*.deb /tmp/deb-out/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: /tmp/deb-out/*.deb

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/deb-out/*.deb
          generate_release_notes: true
